<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음악 임팩트 컨트롤러 - Music Impact Controller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 음악 임팩트 컨트롤러</h1>
            <p class="subtitle">좌우 음향 조절로 음악을 더 즐겁게</p>
        </header>

        <div class="player-section">
            <!-- File Upload -->
            <div class="upload-area" id="uploadArea">
                <input type="file" id="audioFile" accept="audio/*" hidden>
                <label for="audioFile" class="upload-label">
                    <div class="upload-icon">🎧</div>
                    <div class="upload-text">음악 파일을 선택하세요</div>
                    <div class="upload-hint">MP3, WAV, OGG 등</div>
                </label>
            </div>

            <!-- Now Playing -->
            <div class="now-playing" id="nowPlaying" style="display: none;">
                <div class="track-info">
                    <div class="track-icon">🎵</div>
                    <div class="track-details">
                        <div class="track-name" id="trackName">No track loaded</div>
                        <div class="track-time">
                            <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                        </div>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container">
                    <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
                </div>

                <!-- Playback Controls -->
                <div class="controls">
                    <button class="control-btn" id="playBtn" title="재생">
                        <span class="icon">▶️</span>
                    </button>
                    <button class="control-btn" id="pauseBtn" title="일시정지" style="display: none;">
                        <span class="icon">⏸️</span>
                    </button>
                    <button class="control-btn" id="stopBtn" title="정지">
                        <span class="icon">⏹️</span>
                    </button>
                    <div class="volume-control">
                        <span class="icon">🔊</span>
                        <input type="range" id="volumeSlider" class="slider" min="0" max="100" value="80">
                        <span id="volumeValue">80%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Audio Effects Section -->
        <div class="effects-section" id="effectsSection" style="display: none;">
            <h2>🎛️ 음향 효과 컨트롤</h2>

            <!-- Stereo Panning -->
            <div class="effect-group">
                <div class="effect-header">
                    <label>좌우 음향 조절 (Stereo Pan)</label>
                    <div class="pan-indicator">
                        <span class="pan-label left">L</span>
                        <span class="pan-value" id="panValue">CENTER</span>
                        <span class="pan-label right">R</span>
                    </div>
                </div>
                <div class="slider-container">
                    <input type="range" id="panSlider" class="slider pan-slider" min="-100" max="100" value="0">
                    <div class="pan-visual">
                        <div class="pan-ball" id="panBall"></div>
                    </div>
                </div>
            </div>

            <!-- Bass Boost -->
            <div class="effect-group">
                <div class="effect-header">
                    <label>저음 강화 (Bass Boost)</label>
                    <span class="value-display" id="bassValue">0 dB</span>
                </div>
                <input type="range" id="bassSlider" class="slider" min="0" max="20" value="0" step="1">
            </div>

            <!-- Treble Control -->
            <div class="effect-group">
                <div class="effect-header">
                    <label>고음 조절 (Treble)</label>
                    <span class="value-display" id="trebleValue">0 dB</span>
                </div>
                <input type="range" id="trebleSlider" class="slider" min="-12" max="12" value="0" step="1">
            </div>

            <!-- Reverb -->
            <div class="effect-group">
                <div class="effect-header">
                    <label>리버브 (Reverb)</label>
                    <span class="value-display" id="reverbValue">0%</span>
                </div>
                <input type="range" id="reverbSlider" class="slider" min="0" max="100" value="0">
            </div>

            <!-- 3D Spatial Effect -->
            <div class="effect-group">
                <div class="effect-header">
                    <label>3D 공간감 (Spatial)</label>
                    <span class="value-display" id="spatialValue">0%</span>
                </div>
                <input type="range" id="spatialSlider" class="slider" min="0" max="100" value="0">
            </div>

            <!-- Preset Buttons -->
            <div class="presets">
                <h3>프리셋</h3>
                <div class="preset-buttons">
                    <button class="preset-btn" data-preset="reset">🔄 리셋</button>
                    <button class="preset-btn" data-preset="bass">🔊 베이스 부스트</button>
                    <button class="preset-btn" data-preset="vocal">🎤 보컬 강조</button>
                    <button class="preset-btn" data-preset="concert">🎭 콘서트홀</button>
                    <button class="preset-btn" data-preset="dynamic">⚡ 다이나믹</button>
                </div>
            </div>
        </div>

        <!-- Visualizer -->
        <div class="visualizer-section" id="visualizerSection" style="display: none;">
            <canvas id="visualizer" width="800" height="200"></canvas>
        </div>

        <footer>
            <p>좋아하는 음악을 더 즐겁게 만드는 앱 🎶</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
